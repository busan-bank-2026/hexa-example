<title>헥사고날 따라치기</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #0969da; }

    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --accent: #4493f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; line-height: 1.6; }

  p { margin: 0 0 24px; color: var(--muted); }
  a.card { display: block; padding: 16px 20px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 8px; color: var(--fg); text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  a.card strong { display: block; color: var(--accent); font-size: 1.1rem; }
  a.card span { color: var(--muted); font-size: 0.95rem; }
  footer { margin-top: 32px; font-size: 0.85rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>

<main>

  </a>
  <a class="card" href="계층형완성.html">
    <strong>계층형완성</strong>

  <footer>소스 코드: <a href="https://github.com/busan-bank-2026/hexa-example">busan-bank-2026/hexa-example</a></footer>
